<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      color: #333;
      background-color: #f9fafb;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #111827;
      text-align: center;
    }
    .status {
      font-size: 14px;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background-color: #e5e7eb;
      text-align: center;
    }
    .status.success {
      background-color: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background-color: #fee2e2;
      color: #b91c1c;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    .preview {
      margin-top: 16px;
      font-size: 12px;
      color: #4b5563;
      word-break: break-word;
    }
    .preview img {
      max-width: 100%;
      border-radius: 4px;
      margin-top: 8px;
    }
    .loader {
      display: none;
      border: 3px solid #f3f3f3;
      border-top: 3px solid white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .channels {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Caça Oferta Injector</h2>
  
  <div id="status" class="status">Pronto para extrair desta página.</div>
  
  <div class="channels">
    <label class="channel-item">
      <input type="checkbox" id="chk-telegram" value="telegram" checked>
      Telegram
    </label>
    <label class="channel-item">
      <input type="checkbox" id="chk-whatsapp" value="whatsapp">
      WhatsApp
    </label>
    <label class="channel-item">
      <input type="checkbox" id="chk-instagram" value="instagram">
      Instagram
    </label>
  </div>

  <button id="extractBtn">
    <span id="btnText">Extrair e Publicar Agora</span>
    <div id="btnLoader" class="loader"></div>
  </button>
  
  <div id="preview" class="preview"></div>

  <script src="popup.js"></script>
</body>
</html>
