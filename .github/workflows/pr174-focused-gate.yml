name: PR174 Focused Gate

on:
  push:
    branches:
      - feat/commercial-cross-market-portfolio-v1

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/tests/core/curation/commercial-portfolio-selector.test.ts src/tests/app/api/ai-generate-route.test.ts
