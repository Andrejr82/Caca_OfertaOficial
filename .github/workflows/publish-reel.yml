name: Publish Official Instagram Post

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'Tenant ID (UUID)'
        required: true
        type: string
      postId:
        description: 'Official Post ID (UUID)'
        required: true
        type: string
      offerId:
        description: 'Official Offer ID (UUID)'
        required: true
        type: string

jobs:
  publish-official-post:
    name: Submit Official Publication Command
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Submit command
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_TENANT_ID: ${{ github.event.inputs.tenantId }}
          INPUT_POST_ID: ${{ github.event.inputs.postId }}
          INPUT_OFFER_ID: ${{ github.event.inputs.offerId }}
          INPUT_CHANNEL: instagram
        run: npx tsx scripts/github-publish.ts
