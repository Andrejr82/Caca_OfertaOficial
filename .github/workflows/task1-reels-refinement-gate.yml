name: Task1 Reels Refinement Gate

on:
  push:
    branches:
      - feat/reels-two-scene-prompt-studio

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/tests/lib/videos/reels-playbook.test.ts
      - name: Typecheck Task1 files
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --jsx preserve --allowJs false --esModuleInterop true --resolveJsonModule true --isolatedModules true --strict true --lib ES2022,DOM,DOM.Iterable 'src/lib/videos/reels-playbook.ts' 'src/app/(dashboard)/reels/ReelsPromptStudio.tsx'
      - run: npx eslint 'src/lib/videos/reels-playbook.ts' 'src/app/(dashboard)/reels/ReelsPromptStudio.tsx'
