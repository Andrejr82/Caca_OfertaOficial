name: Documentation Audit

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - "apps/**"
      - ".github/workflows/docs-audit.yml"
      - ".env.example"
      - "package.json"
      - "next.config.ts"
      - "vercel.json"
      - "README.md"
      - "docs/**"
  push:
    branches: [main]

jobs:
  documentation-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test documentation domain rules
        run: node --test scripts/tests/docs-audit-rules.test.mjs
      - name: Audit required documentation
        run: node scripts/docs-audit.mjs
