name: Task1 Video Creative Director Gate

on:
  push:
    branches:
      - feat/reels-two-scene-prompt-studio

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/tests/lib/videos/reels-playbook.test.ts src/tests/videos/gemini-prompt.test.ts
      - name: Typecheck focused files
        run: |
          node -e "require('fs').writeFileSync('tsconfig.task1-video.json', JSON.stringify({extends:'./tsconfig.json',compilerOptions:{noEmit:true,skipLibCheck:true},include:['src/lib/videos/sales-video-creative-director.ts','src/lib/videos/reels-playbook.ts','src/lib/videos/gemini-prompt.ts','src/lib/videos/gemini-usability-prompt.ts','src/app/(dashboard)/reels/ReelsPromptStudio.tsx']},null,2))"
          npx tsc -p tsconfig.task1-video.json
      - run: npx eslint 'src/lib/videos/sales-video-creative-director.ts' 'src/lib/videos/reels-playbook.ts' 'src/lib/videos/gemini-prompt.ts'
