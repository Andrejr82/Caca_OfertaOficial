name: Nichos Canonical Gate

on:
  push:
    branches:
      - feat/nichos-comerciais-v1
  workflow_dispatch:

jobs:
  niche-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run focused niche gate
        run: |
          node --test \
            scripts/tests/commercial-niche-config.test.cjs \
            scripts/tests/commercial-niche-contracts.test.cjs \
            scripts/tests/commercial-niche-runtime-adapter.test.cjs \
            scripts/tests/commercial-niche-golden-set.test.cjs \
            scripts/tests/canonical-seven-niche-schedule.test.cjs \
            scripts/tests/commercial-niche-active-routing.test.cjs \
            scripts/tests/commercial-niche-official-grid-runtime.test.cjs \
            scripts/tests/commercial-niche-ui-schedule.test.cjs
