name: Task1 Reels Focused Gate

on:
  push:
    branches:
      - feat/reels-two-scene-prompt-studio

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/tests/lib/videos/reels-playbook.test.ts
      - name: Typecheck Task1 files
        run: |
          cat > tsconfig.task1.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "src/lib/videos/reels-playbook.ts",
              "src/app/(dashboard)/reels/ReelsPromptStudio.tsx",
              "src/app/(dashboard)/reels/page.tsx"
            ],
            "exclude": ["node_modules", "scripts", "src/tests"]
          }
          EOF
          npx tsc --noEmit -p tsconfig.task1.json
      - run: npx eslint 'src/lib/videos/reels-playbook.ts' 'src/app/(dashboard)/reels/ReelsPromptStudio.tsx' 'src/app/(dashboard)/reels/page.tsx'
